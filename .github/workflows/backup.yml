name: Encrypted database backup

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PGCONNECT_TIMEOUT: "30"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Create encrypted database dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test -n "$BACKUP_ENCRYPTION_KEY"
          mkdir -p backup
          pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-acl --file=backup/personal-ai-coach.dump
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in backup/personal-ai-coach.dump \
            -out backup/personal-ai-coach.dump.enc \
            -pass env:BACKUP_ENCRYPTION_KEY
          rm backup/personal-ai-coach.dump
          sha256sum backup/personal-ai-coach.dump.enc > backup/SHA256SUMS.txt

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-coach-db-${{ github.run_id }}
          path: backup/
          retention-days: 30
          if-no-files-found: error
