name: Supabase database backup

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify backup secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Backup roles
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
      - name: Backup schema
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
      - name: Backup data
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --data-only --use-copy
      - name: Commit backup
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Automated Supabase backup"
          file_pattern: "backup/*.sql"
